<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1585" role="img" aria-labelledby="t d">
<title id="t">Research thrusts for mobile</title>
<desc id="d">A vertical mobile layout of four research thrusts and their strategic questions.</desc>
<style>
  .t{font:700 46px Arial,sans-serif;fill:#102133}
  .s{font:400 22px Arial,sans-serif;fill:#506273}
  .h{font:700 28px Arial,sans-serif}
  .q{font:700 21px Arial,sans-serif}
  .qt{font:400 21px Arial,sans-serif;fill:#34495e}
  .c{font:700 30px Arial,sans-serif;fill:#102133}
  .cs{font:400 19px Arial,sans-serif;fill:#536779}
</style>

<rect width="760" height="1585" fill="#fff"/>

<text x="380" y="62" text-anchor="middle" class="t">Research Thrusts</text>
<text x="380" y="100" text-anchor="middle" class="s">Strategic coordination in cyber-physical systems</text>

<rect x="65" y="128" width="630" height="145" rx="24" fill="#eef4f7" stroke="#cbd8df" stroke-width="2"/>
<text x="380" y="182" text-anchor="middle" class="c">Strategic Decision-Making</text>
<text x="380" y="220" text-anchor="middle" class="cs">Allocation · Matching · Routing · Scheduling</text>
<text x="380" y="250" text-anchor="middle" class="cs">Reassignment · Offloading</text>

<!-- EV charging -->
<rect x="32" y="305" width="696" height="250" rx="20" fill="#f3fbf6" stroke="#b7dbc6" stroke-width="2"/>
<text x="55" y="350" class="h" fill="#0f6b50">EV Charging &amp; Intelligent Mobility</text>
<path d="M78 410 h150 l28 18 h28 v36 H68 v-36z" fill="#fff" stroke="#315c72" stroke-width="4"/>
<circle cx="105" cy="466" r="14" fill="#315c72"/>
<circle cx="240" cy="466" r="14" fill="#315c72"/>
<rect x="305" y="390" width="46" height="86" rx="5" fill="#1b7f5c"/>
<path d="M340 432 C410 390 485 395 555 432" fill="none" stroke="#17885f" stroke-width="4" stroke-dasharray="8 8"/>
<circle cx="555" cy="432" r="9" fill="#17885f"/>
<text x="55" y="525" class="q" fill="#0f6b50">Strategic question:</text>
<text x="245" y="525" class="qt">Who charges where and when?</text>

<!-- Mechanism design -->
<rect x="32" y="575" width="696" height="250" rx="20" fill="#f4f8fd" stroke="#bdd2ee" stroke-width="2"/>
<text x="55" y="620" class="h" fill="#164f96">Mechanism Design &amp; Reassignment</text>
<circle cx="110" cy="690" r="16" fill="#2780c8"/>
<circle cx="110" cy="735" r="16" fill="#2ca66a"/>
<path d="M145 690 C235 690 265 655 365 655" fill="none" stroke="#2780c8" stroke-width="4"/>
<path d="M145 735 C235 735 265 700 365 700" fill="none" stroke="#2ca66a" stroke-width="4"/>
<path d="M365 637 l58 32 v55 h-116 v-55z" fill="#315c72"/>
<text x="55" y="795" class="q" fill="#164f96">Strategic question:</text>
<text x="245" y="795" class="qt">Who gets what, and when to reassign?</text>

<!-- Public safety -->
<rect x="32" y="845" width="696" height="250" rx="20" fill="#fff5f5" stroke="#efbcbc" stroke-width="2"/>
<text x="55" y="890" class="h" fill="#9e2222">Public Safety &amp; Healthcare CPS</text>
<path d="M85 950 h110 M110 950 l-25 20 M170 950 l25 20" fill="none" stroke="#315c72" stroke-width="5" stroke-linecap="round"/>
<rect x="123" y="942" width="36" height="18" rx="6" fill="#315c72"/>
<path d="M250 975 h150 l25 20 h30 v34 H240 v-34z" fill="#fff" stroke="#315c72" stroke-width="4"/>
<rect x="470" y="935" width="95" height="95" fill="#fff" stroke="#315c72" stroke-width="4"/>
<rect x="508" y="952" width="20" height="60" fill="#d94848"/>
<rect x="488" y="972" width="60" height="20" fill="#d94848"/>
<text x="55" y="1065" class="q" fill="#9e2222">Strategic question:</text>
<text x="245" y="1065" class="qt">Which resource goes where and when?</text>

<!-- Edge/IoT -->
<rect x="32" y="1115" width="696" height="270" rx="20" fill="#f7f4fd" stroke="#cfbee9" stroke-width="2"/>
<text x="55" y="1160" class="h" fill="#5c2a95">Edge, IoT &amp; Distributed Systems</text>
<path d="M280 1210 C310 1175 365 1180 375 1220 C405 1222 420 1246 410 1268 H245 C235 1240 250 1218 280 1210z" fill="#65a9de"/>
<line x1="330" y1="1270" x2="330" y2="1305" stroke="#315c72" stroke-width="5"/>
<rect x="300" y="1305" width="60" height="32" rx="6" fill="#315c72"/>
<path d="M330 1337 C275 1337 235 1348 195 1360 M330 1337 C385 1337 425 1348 465 1360" fill="none" stroke="#6f42c1" stroke-width="4" stroke-dasharray="8 8"/>
<text x="55" y="1360" class="q" fill="#5c2a95">Strategic question:</text>
<text x="245" y="1360" class="qt">What to offload, where, and when?</text>

<!-- Impact -->
<rect x="32" y="1415" width="696" height="125" rx="20" fill="#f4f7f9" stroke="#d8e0e7"/>
<text x="55" y="1460" font-family="Arial" font-size="25" font-weight="700" fill="#102133">Impact</text>
<text x="160" y="1460" class="cs">Sustainable infrastructure · Safer communities</text>
<text x="160" y="1492" class="cs">Efficient resource use · Real-world impact</text>
</svg>