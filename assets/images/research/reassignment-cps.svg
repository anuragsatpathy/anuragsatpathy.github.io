<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Capacity-aware reassignment in shared CPS</title>
  <desc id="desc">A shared cyber-physical system detects non-compliance and performs capacity-aware reassignment using exchange cycles.</desc>
  <rect width="760" height="360" fill="#f7f9fb"/>
  <g transform="translate(38 52)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="168" height="212" rx="8" fill="#ffffff" stroke="#d8e3e8"/>
    <text x="18" y="34" font-size="18" font-weight="700" fill="#102133">Initial plan</text>
    <text x="18" y="60" font-size="14" fill="#324657">Stable assignment</text>
    <circle cx="50" cy="112" r="22" fill="#f05a28"/>
    <circle cx="116" cy="112" r="22" fill="#2f6f8f"/>
    <rect x="26" y="160" width="48" height="30" rx="5" fill="#e7f4ee" stroke="#2f8f73"/>
    <rect x="92" y="160" width="48" height="30" rx="5" fill="#e7f4ee" stroke="#2f8f73"/>
    <path d="M50 134 L50 160 M116 134 L116 160" stroke="#6f7f8f" stroke-width="3"/>
  </g>
  <path d="M230 160 h70" stroke="#2f6f8f" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="302,160 286,150 286,170" fill="#2f6f8f"/>
  <g transform="translate(318 52)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="168" height="212" rx="8" fill="#ffffff" stroke="#d8e3e8"/>
    <text x="18" y="34" font-size="18" font-weight="700" fill="#102133">Deviation</text>
    <text x="18" y="60" font-size="14" fill="#324657">Updated preferences</text>
    <circle cx="50" cy="112" r="22" fill="#f05a28"/>
    <circle cx="116" cy="112" r="22" fill="#2f6f8f"/>
    <rect x="26" y="160" width="48" height="30" rx="5" fill="#e7f4ee" stroke="#2f8f73"/>
    <rect x="92" y="160" width="48" height="30" rx="5" fill="#fff7e8" stroke="#d98b22"/>
    <path d="M50 134 C78 160 92 160 116 134" stroke="#d34a3a" stroke-width="4" fill="none"/>
  </g>
  <path d="M510 160 h70" stroke="#2f6f8f" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="582,160 566,150 566,170" fill="#2f6f8f"/>
  <g transform="translate(598 52)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="124" height="212" rx="8" fill="#ffffff" stroke="#d8e3e8"/>
    <text x="18" y="34" font-size="18" font-weight="700" fill="#102133">Recovery</text>
    <text x="18" y="60" font-size="14" fill="#324657">ReACT-TTC</text>
    <circle cx="62" cy="115" r="42" fill="#eef4f7" stroke="#2f6f8f" stroke-width="4"/>
    <path d="M62 74 C104 84 104 146 62 156 C20 146 20 84 62 74" fill="none" stroke="#2f8f73" stroke-width="4"/>
    <polygon points="65,72 78,80 63,88" fill="#2f8f73"/>
    <text x="62" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#102133">Cycle</text>
  </g>
  <text x="38" y="326" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#102133">Post-choice reassignment</text>
  <text x="38" y="350" font-family="Arial, sans-serif" font-size="16" fill="#102133">ReACT-TTC, W-TTC, and KATCH repair shared-resource CPS after non-compliance or uncertainty.</text>
</svg>
