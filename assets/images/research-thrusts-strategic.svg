<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Research thrusts: strategic decision-making in cyber-physical systems</title>
<desc id="desc">Four connected research thrusts showing the strategic decisions in EV charging and intelligent mobility, mechanism design and reassignment, public safety and healthcare CPS, and edge, IoT and distributed systems.</desc>
<defs>
  <style>
    .bg{fill:#fff}
    .title{font:700 56px Arial,sans-serif;fill:#0f2238}
    .subtitle{font:400 28px Arial,sans-serif;fill:#40566d}
    .panelTitle{font:700 30px Arial,sans-serif}
    .qLabel{font:700 20px Arial,sans-serif}
    .qText{font:400 20px Arial,sans-serif;fill:#34495e}
    .centerTitle{font:700 32px Arial,sans-serif;fill:#10233d}
    .centerSmall{font:400 18px Arial,sans-serif;fill:#43576c}
    .impactTitle{font:700 28px Arial,sans-serif;fill:#10233d}
    .impactText{font:400 18px Arial,sans-serif;fill:#354a60}
    .thin{stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon{stroke:#2a4b6d;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fcf9"/><stop offset="1" stop-color="#eef8f2"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef5fd"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafa"/><stop offset="1" stop-color="#fdf1f1"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaff"/><stop offset="1" stop-color="#f2effb"/></linearGradient>
  <linearGradient id="gCenter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#e9f0f5"/></linearGradient>
</defs>

